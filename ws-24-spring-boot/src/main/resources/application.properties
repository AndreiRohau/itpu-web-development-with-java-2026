management.endpoints.web.base-path=/custom-actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=mappings

info.app.name=My Spring Boot App
info.app.version=1.1.1
info.app.description=A Spring Boot Application with Actuator

# A file-backed H2 database keeps registered accounts when the app restarts.
# The database files are created in the working directory as authdb.mv.db.
spring.datasource.url=jdbc:h2:file:./authdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Keep the example schema in sync with the JPA entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Keep the schema readable in this learning example.
spring.jpa.properties.hibernate.format_sql=true
