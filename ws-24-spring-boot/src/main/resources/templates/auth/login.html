<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="card">
    <p class="eyebrow">Spring Boot auth example</p>
    <h1>Welcome back</h1>
    <p class="muted">Sign in with your username and password.</p>

    <p class="notice error" th:if="${param.error}">Username or password was not recognized.</p>
    <p class="notice success" th:if="${param.registered}">Account created. You can sign in now.</p>
    <p class="notice success" th:if="${param.logout}">You have signed out.</p>

    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Sign in</button>
    </form>

    <p class="form-footer">New here? <a th:href="@{/register}">Create an account</a></p>
</main>
</body>
</html>
